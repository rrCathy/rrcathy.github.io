<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: #0d1117;
        color: #c9d1d9;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      h1 { font-size: 4rem; color: #58a6ff; }
      p { color: #8b949e; margin: 12px 0 24px; }
      a {
        color: #58a6ff;
        text-decoration: none;
        font-weight: 600;
        padding: 10px 24px;
        border: 1px solid #30363d;
        border-radius: 8px;
        transition: 0.2s;
      }
      a:hover { border-color: #58a6ff; }
    </style>
  </head>
  <body>
    <div>
      <h1>404</h1>
      <p>Page not found</p>
      <a href="/">Return Home</a>
    </div>
  </body>
</html>
